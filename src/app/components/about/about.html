<section id="about" class="py-24 px-6 border-t border-neutral-900 relative">
  <div class="max-w-6xl mx-auto">
    <app-section-heading
      eyebrow="About Me"
      title="Engineering digital experiences with precision and scale."
      subtitle="A relentless builder obsessed with clean code, robust architecture, and seamless user experiences."
    />

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      @for (item of highlights; track item.title) {
        <div appSpotlight class="group glass-card p-8 rounded-3xl space-y-4 transition-all duration-300">
          <div class="w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center text-white text-xl transition duration-500 group-hover:bg-white/20 group-hover:scale-105">
            <i [class]="item.icon"></i>
          </div>
          <h4 class="text-xl font-bold text-white">{{ item.title }}</h4>
          <p class="text-neutral-400 text-sm leading-relaxed">{{ item.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
