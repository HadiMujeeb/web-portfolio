<section id="experience" class="py-24 px-6 border-t border-neutral-900">
  <div class="max-w-4xl mx-auto">
    <app-section-heading eyebrow="Career Path" title="Professional Experience" />

    <div class="space-y-8">
      @for (exp of experiences; track exp.role) {
        <div appSpotlight class="glass-card p-8 rounded-3xl relative border-l-2" [class]="exp.accent">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-4">
            <div>
              <h4 class="text-xl font-bold text-white">{{ exp.role }}</h4>
              <p class="text-sm text-neutral-400 mt-0.5">{{ exp.company }}</p>
            </div>
            <span class="inline-block mt-2 sm:mt-0 px-3 py-1 bg-neutral-900 border border-neutral-800 rounded-full text-xs text-neutral-300 w-fit">{{ exp.period }}</span>
          </div>
          <p class="text-neutral-300 text-sm leading-relaxed">{{ exp.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
