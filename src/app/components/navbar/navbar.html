<header class="fixed top-4 left-0 right-0 z-50 flex justify-center px-4">
  <nav
    class="glass-pill rounded-full px-5 py-3 flex items-center justify-end md:justify-center w-full max-w-5xl shadow-2xl transition-all duration-300"
  >

    <!-- Desktop Navigation Links -->
    <div
      class="relative hidden md:flex items-center space-x-1 lg:space-x-2 text-sm font-medium text-mutedtext"
      (mouseleave)="hidePill()"
    >

      <!-- Sliding highlight that follows the hovered link -->
      <span
        aria-hidden="true"
        class="absolute top-0 bottom-0 rounded-full bg-white/10 border border-white/10 pointer-events-none"
        [style.left.px]="pill().left"
        [style.width.px]="pill().width"
        [style.opacity]="pill().visible ? 1 : 0"
        [style.transition]="pill().snap
          ? 'opacity 250ms ease'
          : 'left 400ms cubic-bezier(0.22,1,0.36,1),
             width 400ms cubic-bezier(0.22,1,0.36,1),
             opacity 250ms ease'"
      ></span>

      @for (link of links; track link.href) {
        <a
          [href]="link.href"
          (mouseenter)="movePill($event)"
          (focus)="movePill($event)"
          (blur)="hidePill()"
          class="relative px-3 py-1.5 rounded-full hover:text-white focus-visible:text-white transition-colors duration-300"
        >
          {{ link.label }}
        </a>
      }

    </div>

    <!-- Contact -->
    <a
      href="#contact"
      class="fx-primary hidden sm:inline-flex items-center justify-center md:ml-3 px-4 py-1.5 text-xs font-semibold uppercase tracking-wider text-black bg-white rounded-full hover:bg-neutral-200"
    >
      Contact
    </a>

    <!-- Mobile Menu Toggle -->
    <button
      type="button"
      class="md:hidden text-white p-1.5 ml-2 focus:outline-none"
      aria-label="Toggle navigation menu"
      aria-controls="mobile-menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <i class="fa-solid fa-bars text-lg"></i>
    </button>

  </nav>

<!-- Mobile Menu Dropdown -->
@if (menuOpen()) {
  <div
    id="mobile-menu"
    class="absolute top-20 left-4 right-4 glass-pill rounded-2xl p-3 md:hidden shadow-2xl border border-neutral-800"
  >
    @for (link of links; track link.href) {
      <a
        [href]="link.href"
        (click)="closeMenu()"
        class="group flex items-center w-full px-4 py-3 rounded-xl
               text-base font-medium text-neutral-300
               transition-all duration-300 ease-out
               hover:bg-white/10 hover:text-white
               active:bg-white/15 active:text-white
               focus-visible:bg-white/10 focus-visible:text-white
               focus-visible:outline-none"
      >
        <span
          class="mr-3 h-1.5 w-1.5 rounded-full bg-transparent
                 transition-all duration-300
                 group-hover:bg-white
                 group-focus-visible:bg-white"
        ></span>

        <span>{{ link.label }}</span>
      </a>
    }

    <a
      href="#contact"
      (click)="closeMenu()"
      class="group flex items-center justify-center w-full
             px-4 py-3 mt-2 rounded-xl
             text-base font-semibold text-black bg-white
             transition-all duration-300
             hover:bg-neutral-200
             active:scale-[0.98]"
    >
      Contact Me
    </a>
  </div>
}

</header>
