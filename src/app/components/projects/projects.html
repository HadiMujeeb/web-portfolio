<section id="projects" class="py-24 px-6 border-t border-neutral-900 bg-neutral-950/40">
  <div class="max-w-6xl mx-auto">
    <app-section-heading
      eyebrow="Portfolio"
      title="Featured Projects"
      subtitle="Selected full-stack applications from my resume, built with the MEAN stack and related tools."
    />

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (project of projects; track project.title) {
        <div appSpotlight class="glass-card rounded-3xl overflow-hidden group flex flex-col justify-between">
          <div>
            <div class="h-48 overflow-hidden bg-neutral-900 relative">
              <img
                [src]="project.image"
                [alt]="project.title"
                class="w-full h-full object-cover group-hover:scale-105 transition duration-500 grayscale group-hover:grayscale-0"
              />
              <div class="absolute inset-0 bg-black/30"></div>
            </div>
            <div class="p-6 space-y-3">
              <h4 class="text-xl font-bold text-white">{{ project.title }}</h4>
              <p class="text-neutral-400 text-sm leading-relaxed">{{ project.description }}</p>
            </div>
          </div>
          <div class="p-6 pt-0 flex items-center justify-between">
            <div class="flex flex-wrap gap-2">
              @for (tag of project.tags; track tag) {
                <span class="text-xs px-2.5 py-1 rounded-full bg-neutral-900 border border-neutral-800 text-neutral-300">{{ tag }}</span>
              }
            </div>
            <a [href]="project.link" class="link-fx text-white text-sm font-semibold flex items-center space-x-1">
              <span>View</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
            </a>
          </div>
        </div>
      }
    </div>
  </div>
</section>
