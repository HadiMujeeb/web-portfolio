<section id="resume" class="py-24 px-6 border-t border-neutral-900">
  <div class="max-w-4xl mx-auto text-center space-y-8">
    <div class="space-y-4">
      <h2 class="text-xs uppercase tracking-widest text-neutral-500 font-semibold">Credentials</h2>
      <h3 class="text-3xl sm:text-4xl font-bold tracking-tight text-white">Curriculum Vitae</h3>
      <p class="text-neutral-400 text-base max-w-xl mx-auto">Download a comprehensive overview of my professional background, education, and technical expertise.</p>
    </div>

    <div class="inline-flex flex-wrap justify-center gap-4">
      <a [href]="resumeHref" [download]="resumeFileName" class="fx-primary px-8 py-4 rounded-full bg-white text-black font-semibold text-sm hover:bg-neutral-200 shadow-lg flex items-center space-x-2">
        <i class="fa-solid fa-file-arrow-down"></i>
        <span>Download Resume</span>
      </a>
      <a appSpotlight href="#contact" class="px-8 py-4 rounded-full bg-neutral-900 border border-neutral-800 text-white font-semibold text-sm hover:bg-neutral-800 transition flex items-center space-x-2">
        <i class="fa-solid fa-envelope"></i>
        <span>Get in Touch</span>
      </a>
    </div>
  </div>
</section>
